<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LGU Cortes | Staff & Officer of the Day</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
html{scroll-behavior:smooth}
.toast-progress{animation:toastLife 4.2s linear forwards;transform-origin:left}
@keyframes toastLife{from{transform:scaleX(1)}to{transform:scaleX(0)}}
</style>
</head>
<body class="bg-slate-950 min-h-screen p-4 sm:p-6 text-slate-100 font-sans">

<div id="loginSection" class="max-w-md mx-auto mt-10 sm:mt-20 p-7 sm:p-8 bg-slate-900 rounded-3xl border border-slate-800 shadow-2xl">
  <div class="text-center">
    <img src="images/cortes.jpg" alt="Logo" class="w-20 h-20 rounded-full mx-auto mb-5 border-2 border-slate-700 object-cover">
    <h2 class="text-xl font-black text-blue-400 tracking-widest uppercase">LGU Staff Console</h2>
    <p class="text-[10px] text-slate-400 mt-2 mb-6">Department staff and Officer of the Day access</p>
  </div>

  <label class="text-[10px] font-black text-slate-400 uppercase ml-1">Account Type</label>
  <select id="adminRole" onchange="toggleDepartment()" class="w-full p-4 my-2 rounded-xl bg-slate-800 border border-slate-700 text-white text-xs font-bold outline-none focus:ring-2 focus:ring-blue-500">
    <option value="staff">Department Staff</option>
    <option value="officer">Officer of the Day</option>
  </select>

  <div id="departmentWrap">
    <label class="text-[10px] font-black text-slate-400 uppercase ml-1">Department</label>
    <select id="adminDept" class="w-full p-4 my-2 rounded-xl bg-slate-800 border border-slate-700 text-white text-xs font-bold outline-none focus:ring-2 focus:ring-blue-500">
      <option value="" disabled selected>Select Department...</option>
      <option>Municipal Planning and Development Office</option>
      <option>Business Permit and Licensing Office</option>
      <option>Office of the Municipal Treasurer</option>
      <option>Local Chief Executive's Office</option>
      <option>Human Resource Management Office</option>
      <option>Municipal Social Welfare and Development Office</option>
      <option>Municipal Budget Officer</option>
      <option>Local Civil Registry Office</option>
      <option>Municipal Agricultural Officer</option>
      <option>Department of Interior and Local Government (DILG)</option>
    </select>
  </div>

  <input id="adminUser" type="email" placeholder="Firebase account email" class="w-full p-4 mt-3 rounded-xl bg-slate-800 border border-slate-700 text-white outline-none focus:ring-2 focus:ring-blue-500 text-sm">
  <input id="adminPass" type="password" placeholder="Password" class="w-full p-4 mt-3 mb-5 rounded-xl bg-slate-800 border border-slate-700 text-white outline-none focus:ring-2 focus:ring-blue-500 text-sm">
  <button id="loginBtn" onclick="checkAdmin()" class="w-full bg-blue-600 hover:bg-blue-500 p-4 rounded-xl font-black transition shadow-lg active:scale-95 text-xs">LOGIN TO CONSOLE</button>
  <p class="text-[9px] text-slate-500 mt-4 text-center">Accounts are authenticated through Firebase Authentication.</p>
</div>

<div id="dashboard" class="hidden max-w-7xl mx-auto">
  <header class="flex flex-col sm:flex-row gap-5 justify-between items-start sm:items-center mb-6 bg-slate-900 p-5 sm:p-6 rounded-3xl border border-slate-800 shadow-xl">
    <div class="flex items-center gap-4">
      <img src="images/cortes.jpg" alt="Logo" class="w-14 h-14 rounded-full border-2 border-slate-700 object-cover">
      <div>
        <div class="flex items-center gap-2 flex-wrap">
          <h1 id="deptTitleDisplay" class="text-lg sm:text-xl font-black tracking-tight uppercase">Dashboard</h1>
          <span id="roleBadge" class="px-2 py-1 rounded-lg bg-blue-500/10 text-blue-400 text-[8px] font-black uppercase">STAFF</span>
        </div>
        <p class="text-[9px] text-blue-500 font-black mt-2 tracking-[0.2em]">OFFICIAL LGU CORTES CONNECT</p>
      </div>
    </div>
    <button onclick="logoutAdmin()" class="bg-red-950/30 text-red-400 px-5 py-2.5 rounded-xl text-xs font-black hover:bg-red-600 hover:text-white transition uppercase">Logout</button>
  </header>

  <div id="officerSummary" class="hidden grid grid-cols-2 lg:grid-cols-4 gap-3 mb-5"></div>
  <div id="officerFilters" class="hidden mb-5 bg-slate-900 border border-slate-800 rounded-2xl p-4">
    <div class="flex flex-col sm:flex-row gap-3">
      <input id="scheduleSearch" oninput="filterOfficerRows()" placeholder="Search citizen, service, or office..." class="flex-1 p-3 rounded-xl bg-slate-800 border border-slate-700 text-white text-sm outline-none focus:ring-2 focus:ring-blue-500">
      <select id="scheduleOfficeFilter" onchange="filterOfficerRows()" class="p-3 rounded-xl bg-slate-800 border border-slate-700 text-white text-sm outline-none focus:ring-2 focus:ring-blue-500">
        <option value="">All Offices</option>
      </select>
      <select id="scheduleStatusFilter" onchange="filterOfficerRows()" class="p-3 rounded-xl bg-slate-800 border border-slate-700 text-white text-sm outline-none focus:ring-2 focus:ring-blue-500">
        <option value="">All Statuses</option><option>Pending</option><option>Approved</option><option>Completed</option><option>Cancelled</option>
      </select>
    </div>
  </div>

  <div id="adminList" class="grid gap-4 md:grid-cols-2 lg:grid-cols-3"></div>
</div>

<div id="emailModal" class="hidden fixed inset-0 bg-black/90 flex items-center justify-center p-5 z-50 backdrop-blur-sm">
  <div class="bg-slate-900 p-7 rounded-3xl border border-slate-800 max-w-sm w-full shadow-2xl">
    <h3 class="text-xl font-black mb-2 text-blue-400 uppercase">Set Schedule</h3>
    <p id="targetEmail" class="text-[10px] text-slate-500 mb-6 font-mono break-all bg-slate-800 p-2 rounded"></p>
    <div class="space-y-4">
      <div><label class="text-[10px] font-black text-slate-400 uppercase ml-1">Visit Date</label><input id="schedDate" type="date" class="w-full p-3 rounded-xl bg-slate-800 border-none text-white"></div>
      <div><label class="text-[10px] font-black text-slate-400 uppercase ml-1">Visit Time</label><input id="schedTime" type="time" class="w-full p-3 rounded-xl bg-slate-800 border-none text-white"></div>
    </div>
    <div class="flex gap-3 mt-8">
      <button onclick="closeModal()" class="flex-1 bg-slate-800 p-3 rounded-xl font-black text-xs hover:bg-slate-700">CANCEL</button>
      <button id="sendEmailBtn" class="flex-1 bg-blue-600 p-3 rounded-xl font-black text-xs hover:bg-blue-500">APPROVE & EMAIL</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, doc, getDoc, collection, query, where, onSnapshot, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
 apiKey:"AIzaSyAp1YJkWIUYzWdxTV_awoeOIzfghkGPCU",
 authDomain:"lgu-cortes.firebaseapp.com", projectId:"lgu-cortes",
 storageBucket:"lgu-cortes.firebasestorage.app", messagingSenderId:"603868399677",
 appId:"1:603868399677:web:bc4a28aebd73cdb6318254", measurementId:"G-NXFJQVHV1Y"
};
const app=initializeApp(firebaseConfig), auth=getAuth(app), db=getFirestore(app);
let currentDocId="", currentCitizenEmail="", currentMode="staff", allOfficerRows=[], unsubscribe=null;

window.showAlert=(message,type="info")=>{
 const old=document.getElementById("lguToast"); if(old) old.remove();
 const cfg={success:["✓","Success","bg-emerald-500","bg-emerald-500/15 text-emerald-400"],error:["!","Error","bg-red-500","bg-red-500/15 text-red-400"],warning:["!","Attention","bg-amber-500","bg-amber-500/15 text-amber-400"],info:["i","Notice","bg-blue-500","bg-blue-500/15 text-blue-400"]}[type]||["i","Notice","bg-blue-500","bg-blue-500/15 text-blue-400"];
 const t=document.createElement("div"); t.id="lguToast"; t.className="fixed top-5 right-5 z-[9999] w-[min(92vw,390px)] translate-x-[120%] opacity-0 transition-all duration-500";
 t.innerHTML=`<div class="overflow-hidden rounded-2xl border border-white/10 bg-slate-900/95 shadow-2xl backdrop-blur-xl"><div class="p-4 flex gap-3 items-start"><div class="w-10 h-10 rounded-xl ${cfg[3]} grid place-items-center font-black">${cfg[0]}</div><div class="flex-1"><p class="text-[10px] font-black uppercase tracking-widest opacity-70">${cfg[1]}</p><p class="mt-1 text-sm font-semibold leading-5">${String(message)}</p></div><button onclick="this.closest('#lguToast').remove()" class="text-slate-500 hover:text-white text-lg">×</button></div><div class="h-1 ${cfg[2]} toast-progress"></div></div>`;
 document.body.appendChild(t); requestAnimationFrame(()=>t.classList.remove("translate-x-[120%]","opacity-0"));
 setTimeout(()=>{t.classList.add("translate-x-[120%]","opacity-0");setTimeout(()=>t.remove(),500)},4200);
};

window.toggleDepartment=()=>document.getElementById("departmentWrap").classList.toggle("hidden",document.getElementById("adminRole").value==="officer");

window.checkAdmin=async()=>{
 const role=document.getElementById("adminRole").value, dept=document.getElementById("adminDept").value;
 const email=document.getElementById("adminUser").value.trim(), pass=document.getElementById("adminPass").value;
 if(!email||!pass) return showAlert("Enter your Firebase account email and password.","warning");
 if(role==="staff"&&!dept) return showAlert("Please select your department.","warning");
 const btn=document.getElementById("loginBtn"); btn.disabled=true; btn.innerText="AUTHENTICATING...";
 try{
   const cred=await signInWithEmailAndPassword(auth,email,pass);
   const sd=await getDoc(doc(db,"staff",cred.user.uid));
   if(!sd.exists()||sd.data().active!==true) throw new Error("Your staff account is not authorized.");
   const profile=sd.data();
   if(role==="staff" && profile.role!=="staff") throw new Error("This account is not a department staff account.");
   if(role==="staff" && profile.department!==dept) throw new Error("This account is not assigned to the selected department.");
   if(role==="officer" && !["officer","officer_of_day"].includes(profile.role)) throw new Error("This account is not authorized as Officer of the Day.");
   currentMode=role;
   document.getElementById("loginSection").classList.add("hidden");
   document.getElementById("dashboard").classList.remove("hidden");
   document.getElementById("deptTitleDisplay").innerText=role==="officer"?"Officer of the Day — All Offices":profile.department;
   document.getElementById("roleBadge").innerText=role==="officer"?"OFFICER OF THE DAY":"DEPARTMENT STAFF";
   if(role==="officer"){document.getElementById("officerSummary").classList.remove("hidden");document.getElementById("officerFilters").classList.remove("hidden");loadOfficerOfDay();}
   else loadAdminDataByDept(profile.department);
 }catch(e){showAlert(e.message||"Login failed.","error");await signOut(auth).catch(()=>{});}
 finally{btn.disabled=false;btn.innerText="LOGIN TO CONSOLE";}
};

window.logoutAdmin=async()=>{if(unsubscribe)unsubscribe();await signOut(auth);location.reload();};

window.openScheduleModal=(id,email)=>{
 currentDocId=id;currentCitizenEmail=email;document.getElementById("targetEmail").innerText=`EMAIL TO: ${email}`;
 document.getElementById("emailModal").classList.remove("hidden");
};
window.closeModal=()=>document.getElementById("emailModal").classList.add("hidden");

function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));}
function requestCard(data,officer=false){
 const status=data.status||"Pending";
 const statusCls=status==="Approved"?"text-emerald-400 bg-emerald-500/10":status==="Completed"?"text-blue-400 bg-blue-500/10":"text-amber-400 bg-amber-500/10";
 const sched=data.schedule?`<div class="bg-blue-900/30 p-3 rounded-xl border border-blue-800/40"><p class="text-[9px] text-blue-400 font-black uppercase">Schedule</p><p class="text-xs text-white font-bold mt-1">📅 ${esc(data.schedule)}</p></div>`:`<div class="bg-amber-500/5 p-3 rounded-xl border border-amber-500/10"><p class="text-[9px] text-amber-400 font-black uppercase">No schedule yet</p></div>`;
 const docs=(data.documentUrls||[]).map((u,i)=>`<a href="${esc(u)}" target="_blank" rel="noopener" class="text-[10px] text-blue-400 uppercase font-black hover:underline block">📄 VIEW REQUIREMENT ${i+1}</a>`).join("") || (data.documentUrl?`<a href="${esc(data.documentUrl)}" target="_blank" rel="noopener" class="text-[10px] text-blue-400 uppercase font-black hover:underline block">📄 VIEW REQUIREMENT</a>`:`<p class="text-[10px] text-slate-500 uppercase font-bold">NO DOC ATTACHED</p>`);
 return `<div class="bg-slate-900 p-5 rounded-3xl border border-slate-800 shadow-xl flex flex-col gap-4">
   <div class="flex justify-between gap-3"><div class="min-w-0">
   ${officer?`<div class="mb-2 inline-flex px-2 py-1 rounded-lg bg-violet-500/10 text-violet-300 text-[9px] font-black uppercase">🏢 ${esc(data.department)}</div>`:""}
   <p class="text-[9px] font-black text-blue-500 uppercase mb-1">CITIZEN: ${esc(data.email)}</p>
   <h4 class="text-lg font-black text-white leading-tight uppercase">${esc(data.fullName)}</h4>
   <div class="mt-3 space-y-1"><p class="text-[10px] text-slate-400 uppercase font-bold">Contact: <span class="text-white">${esc(data.contact)}</span></p><p class="text-[10px] text-slate-400 uppercase font-bold">Service: <span class="text-white">${esc(data.service)}</span></p></div>
   <span class="inline-block mt-2 px-2 py-1 rounded-lg ${statusCls} text-[9px] font-black uppercase">${esc(status)}</span></div>
   ${!officer?`<button onclick="deleteRequest('${data.id}')" class="text-slate-600 hover:text-red-500 p-2">🗑️</button>`:""}</div>
   ${sched}<div>${docs}</div>
   ${!officer?`<div class="flex flex-col gap-2 pt-3 border-t border-slate-800"><button onclick="openScheduleModal('${data.id}','${esc(data.email)}')" class="w-full bg-blue-600 p-3 rounded-xl font-black text-[9px] uppercase hover:bg-blue-500">SET / UPDATE SCHEDULE</button><button onclick="updateStatus('${data.id}','Completed')" class="w-full bg-green-700 p-3 rounded-xl font-black text-[9px] uppercase hover:bg-green-600">MARK AS DONE</button></div>`:""}
 </div>`;
}

window.loadAdminDataByDept=(dept)=>{
 const list=document.getElementById("adminList");
 const q=query(collection(db,"lgu_requests"),where("department","==",dept));
 unsubscribe=onSnapshot(q,snap=>{let rows=[];snap.forEach(d=>rows.push({id:d.id,...d.data()}));rows.sort((a,b)=>(b.timestamp||0)-(a.timestamp||0));list.innerHTML=rows.length?rows.map(x=>requestCard(x)).join(""):`<p class="text-slate-500 text-xs italic text-center py-10 col-span-3">No requests found for this department.</p>`;},
 e=>showAlert("Could not load department requests: "+e.message,"error"));
};

function loadOfficerOfDay(){
 const list=document.getElementById("adminList");
 const q=query(collection(db,"lgu_requests"));
 unsubscribe=onSnapshot(q,snap=>{
   allOfficerRows=[];snap.forEach(d=>allOfficerRows.push({id:d.id,...d.data()}));
   allOfficerRows.sort((a,b)=>((a.schedule||"9999") > (b.schedule||"9999")?1:-1));
   updateOfficerSummary(); populateOfficeFilter(); filterOfficerRows();
 },e=>showAlert("Officer schedule access failed: "+e.message,"error"));
}
function updateOfficerSummary(){
 const total=allOfficerRows.length, scheduled=allOfficerRows.filter(x=>x.schedule).length, pending=allOfficerRows.filter(x=>x.status==="Pending").length, offices=new Set(allOfficerRows.map(x=>x.department)).size;
 document.getElementById("officerSummary").innerHTML=[["TOTAL REQUESTS",total],["SCHEDULED",scheduled],["PENDING",pending],["OFFICES",offices]].map(x=>`<div class="bg-slate-900 border border-slate-800 rounded-2xl p-4"><p class="text-[9px] text-slate-500 font-black">${x[0]}</p><p class="text-2xl font-black mt-1">${x[1]}</p></div>`).join("");
}
function populateOfficeFilter(){
 const select=document.getElementById("scheduleOfficeFilter"), old=select.value;
 const offices=[...new Set(allOfficerRows.map(x=>x.department).filter(Boolean))].sort();
 select.innerHTML=`<option value="">All Offices</option>`+offices.map(o=>`<option value="${esc(o)}">${esc(o)}</option>`).join("");
 if(offices.includes(old))select.value=old;
}
window.filterOfficerRows=()=>{
 const term=document.getElementById("scheduleSearch").value.toLowerCase(), office=document.getElementById("scheduleOfficeFilter").value,status=document.getElementById("scheduleStatusFilter").value;
 const rows=allOfficerRows.filter(x=>(!term||[x.fullName,x.email,x.service,x.department,x.schedule].some(v=>String(v||"").toLowerCase().includes(term)))&&(!office||x.department===office)&&(!status||x.status===status));
 document.getElementById("adminList").innerHTML=rows.length?rows.map(x=>requestCard(x,true)).join(""):`<p class="text-slate-500 text-xs italic text-center py-10 col-span-3">No matching schedules found.</p>`;
};

window.updateStatus=async(id,status)=>{try{await updateDoc(doc(db,"lgu_requests",id),{status});showAlert("Request marked as "+status+".","success")}catch(e){showAlert(e.message,"error")}};
window.deleteRequest=async(id)=>{if(!confirm("Delete this request record?"))return;try{await updateDoc(doc(db,"lgu_requests",id),{status:"Cancelled"});showAlert("Request cancelled.","success")}catch(e){showAlert(e.message,"error")}};

document.getElementById("sendEmailBtn").onclick=async()=>{
 const date=document.getElementById("schedDate").value,time=document.getElementById("schedTime").value;
 if(!date||!time)return showAlert("Set the visit date and time first.","warning");
 try{
  // EmailJS is loaded on the page only when a department staff member schedules a request.
  if(!window.emailjs){await new Promise((resolve,reject)=>{const sc=document.createElement("script");sc.src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js";sc.onload=resolve;sc.onerror=reject;document.head.appendChild(sc)});}
  emailjs.init("1HAeeqqDwsp3c4l81");
  await emailjs.send("service_yk1dfxf","template_agmhyzw",{to_email:currentCitizenEmail,appointment_date:date,appointment_time:time,message:"Please visit LGU Cortes on your scheduled date."});
  await updateDoc(doc(db,"lgu_requests",currentDocId),{status:"Approved",schedule:`${date} @ ${time}`});
  showAlert("Schedule saved and notification sent to the citizen.","success");closeModal();
 }catch(e){showAlert("Unable to save/send schedule: "+e.message,"error")}
};
</script>
</body>
</html>
