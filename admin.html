<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LGU Staff | Department Admin Console</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
</head>
<body class="bg-slate-950 p-6 text-slate-100 font-sans">
    
    <div id="loginSection" class="max-w-sm mx-auto mt-20 p-8 bg-slate-900 rounded-3xl border border-slate-800 shadow-2xl text-center">
        <img src="images/cortes.jpg" alt="Logo" class="w-20 h-20 rounded-full mx-auto mb-6 border-2 border-slate-700 object-cover">
        <h2 class="text-xl font-black mb-2 text-blue-500 tracking-widest uppercase">Department Staff Login</h2>
        <p class="text-[10px] text-slate-400 mb-6">Piliin ang departamento at ilagay ang login credentials.</p>
        
        <select id="adminDept" class="w-full p-4 mb-4 rounded-xl bg-slate-800 border-none text-white text-xs font-bold focus:ring-2 focus:ring-blue-500 outline-none">
            <option value="" disabled selected>Select Department...</option>
            <option value="Municipal Planning and Development Office">Municipal Planning and Development Office</option>
            <option value="Business Permit and Licensing Office">Business Permit and Licensing Office</option>
            <option value="Office of the Municipal Treasurer">Office of the Municipal Treasurer</option>
            <option value="Local Chief Executive's Office">Local Chief Executive's Office</option>
            <option value="Human Resource Management Office">Human Resource Management Office</option>
            <option value="Municipal Social Welfare and Development Office">Municipal Social Welfare and Development Office</option>
            <option value="Municipal Budget Officer">Municipal Budget Officer</option>
            <option value="Local Civil Registry Office">Local Civil Registry Office</option>
            <option value="Municipal Agricultural Officer">Municipal Agricultural Officer</option>
            <option value="Department of Interior and Local Government (DILG)">Department of Interior and Local Government (DILG)</option>
        </select>

        <input id="adminUser" type="text" placeholder="Username (e.g. mspo, bplo)" class="w-full p-4 mb-4 rounded-xl bg-slate-800 border-none text-white focus:ring-2 focus:ring-blue-500 outline-none text-sm">
        <input id="adminPass" type="password" placeholder="Password" class="w-full p-4 mb-6 rounded-xl bg-slate-800 border-none text-white focus:ring-2 focus:ring-blue-500 outline-none text-sm">
        <button onclick="checkAdmin()" class="w-full bg-blue-600 hover:bg-blue-500 p-4 rounded-xl font-black transition-all shadow-lg active:scale-95 text-xs">LOGIN TO CONSOLE</button>
    </div>

    <div id="dashboard" class="hidden max-w-6xl mx-auto">
        <header class="flex justify-between items-center mb-10 bg-slate-900 p-6 rounded-3xl border border-slate-800 shadow-xl">
            <div class="flex items-center gap-6">
                <img src="images/cortes.jpg" alt="Logo" class="w-16 h-16 rounded-full border-2 border-slate-700 object-cover">
                <div>
                    <h1 id="deptTitleDisplay" class="text-xl font-black tracking-tight uppercase leading-none text-white">Department Dashboard</h1>
                    <p class="text-[10px] text-blue-500 font-black mt-2 tracking-[0.2em]">OFFICIAL LGU CORTES CONNECT</p>
                </div>
            </div>
            <button onclick="location.reload()" class="bg-red-950/30 text-red-500 px-6 py-2 rounded-xl text-xs font-black hover:bg-red-600 hover:text-white transition uppercase">Logout</button>
        </header>

        <div id="adminList" class="grid gap-4 md:grid-cols-2 lg:grid-cols-3"></div>
    </div>

    <div id="emailModal" class="hidden fixed inset-0 bg-black/90 flex items-center justify-center p-6 z-50 backdrop-blur-sm">
        <div class="bg-slate-900 p-8 rounded-3xl border border-slate-800 max-w-sm w-full shadow-2xl">
            <h3 class="text-xl font-black mb-2 text-blue-400 uppercase tracking-tight">Set Schedule</h3>
            <p id="targetEmail" class="text-[10px] text-slate-500 mb-6 font-mono break-all bg-slate-800 p-2 rounded"></p>
            
            <div class="space-y-4">
                <div>
                    <label class="text-[10px] font-black text-slate-400 uppercase ml-1">Visit Date</label>
                    <input id="schedDate" type="date" class="w-full p-3 rounded-xl bg-slate-800 border-none text-white focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="text-[10px] font-black text-slate-400 uppercase ml-1">Visit Time</label>
                    <input id="schedTime" type="time" class="w-full p-3 rounded-xl bg-slate-800 border-none text-white focus:ring-2 focus:ring-blue-500">
                </div>
            </div>
            
            <div class="flex gap-3 mt-8">
                <button onclick="closeModal()" class="flex-1 bg-slate-800 p-3 rounded-xl font-black text-xs hover:bg-slate-700 transition">CANCEL</button>
                <button id="sendEmailBtn" class="flex-1 bg-blue-600 p-3 rounded-xl font-black text-xs hover:bg-blue-500 transition shadow-lg">APPROVE & EMAIL</button>
            </div>
        </div>
    </div>

    <script type="module" src="script.js"></script>
    <script>
        window.checkAdmin = function() {
            const dept = document.getElementById('adminDept').value;
            const user = document.getElementById('adminUser').value.trim().toLowerCase();
            const pass = document.getElementById('adminPass').value.trim();

            if(!dept) return alert("Pumili muna ng Department.");

            // Dictionary ng Department Accounts
            const validAccounts = {
                "Municipal Planning and Development Office": { u: "mpdo", p: "mpdo123" },
                "Business Permit and Licensing Office": { u: "bplo", p: "bplo123" },
                "Office of the Municipal Treasurer": { u: "treasurer", p: "treasurer123" },
                "Local Chief Executive's Office": { u: "mayor", p: "mayor123" },
                "Human Resource Management Office": { u: "hr", p: "hr123" },
                "Municipal Social Welfare and Development Office": { u: "mswdo", p: "mswdo123" },
                "Municipal Budget Officer": { u: "budget", p: "budget123" },
                "Local Civil Registry Office": { u: "civil", p: "civil123" },
                "Municipal Agricultural Officer": { u: "agri", p: "agri123" },
                "Department of Interior and Local Government (DILG)": { u: "dilg", p: "dilg123" }
            };

            const target = validAccounts[dept];

            if(target && user === target.u && pass === target.p) {
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('dashboard').classList.remove('hidden');
                document.getElementById('deptTitleDisplay').innerText = dept;
                if (window.loadAdminDataByDept) window.loadAdminDataByDept(dept);
            } else {
                alert("ACCESS DENIED: Maling username o password para sa departamentong ito.");
            }
        }
    </script>
</body>
</html>
